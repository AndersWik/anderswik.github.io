<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangman</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Hangman">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/hangman/hangman.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Hangman</h1>
  <svg viewBox="0 0 200 220" role="img" aria-label="The hanging man">
    <g class="gallows">
      <line x1="20" y1="210" x2="180" y2="210"/>
      <line x1="60" y1="210" x2="60" y2="20"/>
      <line x1="60" y1="20" x2="140" y2="20"/>
      <line x1="140" y1="20" x2="140" y2="50"/>
    </g>
    <circle class="part" cx="140" cy="70" r="20"/>
    <line class="part" x1="140" y1="90" x2="140" y2="150"/>
    <line class="part" x1="140" y1="105" x2="115" y2="130"/>
    <line class="part" x1="140" y1="105" x2="165" y2="130"/>
    <line class="part" x1="140" y1="150" x2="120" y2="190"/>
    <line class="part" x1="140" y1="150" x2="160" y2="190"/>
  </svg>
  <p id="word"></p>
  <p id="wrong"></p>
  <p id="message" aria-live="polite"></p>
  <div id="keyboard"></div>
  <button type="button" id="newWord">New word</button>
</div>
</div>

<script src="/assets/hangman/hangman.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

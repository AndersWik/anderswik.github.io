<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Hex</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Color Hex">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/colorhex/colorhex.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="colorhex container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h2>Color Hex</h2>
    </div>
  </div>
  <div class="row panel-container">
    <div class="col-sm-12 col-md-4" id="color-panel-rgb">
      <p id="color-panel-text-rgb"></p>
    </div>
    <div class="col-sm-12 col-md-4" id="color-panel-rgba">
      <p id="color-panel-text-rgba"></p>
    </div>
    <div class="col-sm-12 col-md-4" id="color-panel-hex">
      <p id="color-panel-text-hex"></p>
    </div>
    <div class="col-sm-12" id="color-panel-inverted">
      <p id="color-panel-text-inverted"></p>
    </div>
  </div>
  <div class="row settings">
    <div class="col-sm-12 form-group mt-3 py-2">
      <label class="pt-2" for="alpha">Alpha:</label>
      <input class="form-control form-control-lg slider" type="range" min="0" max="100" value="50" name="alpha" id="alpha">
    </div>
    <div class="col-sm-12 form-group mt-3 py-2">
      <label class="pt-2" for="red">Red:</label>
      <input class="form-control form-control-lg slider" type="range" min="0" max="255" value="200" name="red" id="red">
    </div>
    <div class="col-sm-12 form-group mt-3 py-2">
      <label class="pt-2" for="green">Green:</label>
      <input class="form-control form-control-lg slider" type="range" min="0" max="255" value="200" name="green" id="green">
    </div>
    <div class="col-sm-12 form-group mt-3 py-2">
      <label class="pt-2" for="blue">Blue:</label>
      <input class="form-control form-control-lg slider" type="range" min="0" max="255" value="50" name="blue" id="blue">
    </div>
    <div class="col-sm-12 form-group mt-3 py-2">
      <label class="pt-2" for="hex">Hex:</label>
      <input class="form-control form-control-lg" type="text" name="hex" id="hex">
    </div>
  </div>
  <div class="container">
    <div class="row mt-3">
      <div class="col-12">
        <h3 id="lighter-color">Lighter</h3>
      </div>
    </div>
    <div id="lighter-color-container" class="row mt-3">

    </div>
  </div>
  <div class="container">
    <div class="row mt-3">
      <div class="col-12">
        <h3 id="darker-color">Darker</h3>
      </div>
    </div>
    <div id="darker-color-container" class="row mt-3">

    </div>
  </div>
  <div class="container">
    <div class="row mt-3">
      <div class="col-12">
        <h3 id="favorite-color">Favorites</h3>
      </div>
    </div>
    <div id="favorite-color-container" class="row mt-3">

    </div>
  </div>
</div>

<script src="/assets/colorhex/colorhex.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

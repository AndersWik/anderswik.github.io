<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chore Wheel</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Chore Wheel">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/chore-wheel/chore-wheel.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Chore Wheel</h1>
  <form class="input-row" id="chore-form" autocomplete="off">
    <input type="text" id="choreInput" placeholder="Enter Chore" aria-label="Chore" />
    <button type="submit" id="choreButton">Add Chore</button>
  </form>
  <form class="input-row" id="person-form" autocomplete="off">
    <input type="text" id="personInput" placeholder="Enter Person" aria-label="Person" />
    <button type="submit" id="personButton">Add Person</button>
  </form>
  <div id="wheel-container">
    <canvas id="wheel" width="300" height="300"></canvas>
    <div id="names-container"></div>
  </div>
  <button type="button" id="spinButton">Spin Wheel</button>
  <p id="result" aria-live="polite"></p>
  <div class="list-container">
    <div>
      <h2>Chores</h2>
      <ul id="choreList"></ul>
    </div>
    <div>
      <h2>People</h2>
      <ul id="peopleList"></ul>
    </div>
  </div>
</div>
</div>

<script src="/assets/chore-wheel/chore-wheel.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

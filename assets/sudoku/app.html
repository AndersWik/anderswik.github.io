<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Sudoku">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/sudoku/sudoku.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Sudoku</h1>
  <label class="difficulty">
    Difficulty
    <select id="difficulty">
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
  </label>

  <div id="board"></div>

  <div class="number-pad" id="numberPad">
    <button type="button" data-number="1">1</button>
    <button type="button" data-number="2">2</button>
    <button type="button" data-number="3">3</button>
    <button type="button" data-number="4">4</button>
    <button type="button" data-number="5">5</button>
    <button type="button" data-number="6">6</button>
    <button type="button" data-number="7">7</button>
    <button type="button" data-number="8">8</button>
    <button type="button" data-number="9">9</button>
    <button type="button" data-number="" aria-label="Erase">&times;</button>
  </div>

  <div class="actions">
    <button type="button" id="check">Check</button>
    <button type="button" id="hint">Hint</button>
    <button type="button" id="restart">New game</button>
  </div>
  <p id="status" class="status" aria-live="polite"></p>
</div>
</div>

<script src="/assets/sudoku/sudoku.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

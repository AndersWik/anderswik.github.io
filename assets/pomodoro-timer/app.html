<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Pomodoro Timer">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/pomodoro-timer/pomodoro-timer.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="pomodoro container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h2>Pomodoro Timer</h2>
    </div>
  </div>

  <div class="pomodoro-card mx-auto mt-4">
    <div class="pomodoro-ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="50"></circle>
        <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="50"></circle>
      </svg>
      <button type="button" class="pomodoro-play" id="play" aria-label="Start">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"></path></svg>
      </button>
    </div>

    <div class="pomodoro-time-row">
      <button type="button" class="pomodoro-step" id="minus" aria-label="One minute less">&minus;</button>
      <span class="pomodoro-time" id="time" aria-live="polite">25:00</span>
      <button type="button" class="pomodoro-step" id="plus" aria-label="One minute more">+</button>
    </div>

    <div class="pomodoro-modes" role="group" aria-label="Mode">
      <button type="button" class="pomodoro-mode active" data-mode="focus">Focus</button>
      <button type="button" class="pomodoro-mode" data-mode="break">Break</button>
    </div>
  </div>
</div>

<script src="/assets/pomodoro-timer/pomodoro-timer.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Flip</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Coin Flip">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/coin-flip/coin-flip.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Coin Flip</h1>
  <div class="result" id="resultCoinHeads">
    <img
      src="/assets/coin-flip/images/head.svg"
      alt="Front of bitcoin coin"
    />
  </div>
  <div class="result" id="resultCoinTails" hidden>
    <img
      src="/assets/coin-flip/images/tails.svg"
      alt="Back of bitcoin coin"
    />
  </div>
  <button type="button" id="flipCoinBtn">Flip Coin!</button>
  <div class="result" id="resultHeads">Heads: 0</div>
  <div class="result" id="resultTails">Tails: 0</div>
</div>
</div>

<script src="/assets/coin-flip/coin-flip.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

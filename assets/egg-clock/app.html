<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Egg Clock</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Egg Clock">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/egg-clock/egg-clock.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="egg-clock container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h2>Egg Clock</h2>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-sm-6">
      <p id="clock-minutes">Minutes</p>
      <p id="output-minutes" class="bw">00</p>
    </div>
    <div class="col-sm-6">
      <p id="clock-seconds">Seconds</p>
      <p id="output-seconds" class="bw">00</p>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-sm-12 col-md-6 mt-3">
      <button type="button" id="button-start" class="btn btn-success">Start</button>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button type="button" id="button-stop" class="btn btn-warning">Stop</button>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button type="button" id="increase-minutes" class="btn btn-secondary">Increase Min</button>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button type="button" id="decrease-minutes" class="btn btn-secondary">Decrease Min</button>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button type="button" id="increase-seconds" class="btn btn-secondary">Increase Sec</button>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button type="button" id="decrease-seconds" class="btn btn-secondary">Decrease Sec</button>
    </div>
  </div>
</div>

<script src="/assets/egg-clock/egg-clock.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

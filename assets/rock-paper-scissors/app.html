<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Rock Paper Scissors">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/rock-paper-scissors/rock-paper-scissors.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Rock Paper Scissors</h1>
  <div class="score">
    <div id="player">
      <p>You</p>
      <p id="playerScore">0</p>
      <img id="playerImage" src="/assets/rock-paper-scissors/images/Rock.svg" alt="Rock">
      <p id="playerChoice">Rock</p>
    </div>
    <div id="cpu">
      <p>Computer</p>
      <p id="computerScore">0</p>
      <img id="computerImage" src="/assets/rock-paper-scissors/images/Scissors.svg" alt="Scissors">
      <p id="computerChoice">Scissors</p>
    </div>
  </div>
  <p id="result" aria-live="polite">Make your choice!</p>
  <div class="choices">
    <button type="button" data-choice="Rock">Rock</button>
    <button type="button" data-choice="Paper">Paper</button>
    <button type="button" data-choice="Scissors">Scissors</button>
  </div>
</div>
</div>

<script src="/assets/rock-paper-scissors/rock-paper-scissors.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

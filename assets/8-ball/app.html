<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic 8 Ball</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Magic 8 Ball">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/8-ball/8-ball.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Magic 8 Ball</h1>
  <img
    id="eightball"
    src="/assets/8-ball/images/eightball.svg"
    alt="A magic 8 ball"
  />
  <form id="ask-form" autocomplete="off">
    <input type="text" id="question" placeholder="Ask your question..." aria-label="Your question" />
    <button type="submit">Shake the Ball</button>
  </form>
  <div id="result" aria-live="polite"></div>
</div>
</div>

<script src="/assets/8-ball/8-ball.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

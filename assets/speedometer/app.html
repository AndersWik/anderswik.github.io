<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speedometer</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Speedometer">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/speedometer/speedometer.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="speedometer container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h1 class="h2">Speedometer</h1>
      <p id="message">Press Start and allow the page to use your location.</p>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col">
      <div class="dial bw">
        <p id="speed" class="speed">0</p>
        <p id="unit" class="unit">km/h</p>
        <p id="gps" class="gps">GPS off</p>
      </div>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-4">
      <p class="label">Max</p>
      <p id="max" class="reading bw">0</p>
    </div>
    <div class="col-4">
      <p class="label">Distance</p>
      <p id="distance" class="reading bw">0.00</p>
    </div>
    <div class="col-4">
      <p class="label">Average</p>
      <p id="average" class="reading bw">0</p>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 mt-3">
      <button type="button" id="button-start" class="btn btn-success">Start</button>
    </div>
    <div class="col-6 mt-3">
      <button type="button" id="button-unit" class="btn btn-secondary">Show mph</button>
    </div>
    <div class="col-6 mt-3">
      <button type="button" id="button-reset" class="btn btn-secondary">Reset</button>
    </div>
  </div>
  <p class="mt-4 text-muted small">Don't use the phone while you drive. Put it in a holder, or give it to a passenger.</p>
</div>

<script src="/assets/speedometer/speedometer.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

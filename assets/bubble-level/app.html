<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Level</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Bubble Level">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/bubble-level/bubble-level.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="bubble-level container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h2>Bubble Level</h2>
      <p id="message">Lay your phone on a surface and press Start.</p>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col">
      <div id="vial" class="vial">
        <div class="ring ring-small"></div>
        <div class="ring ring-large"></div>
        <div class="cross cross-x"></div>
        <div class="cross cross-y"></div>
        <div id="bubble" class="bubble"></div>
      </div>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-6">
      <p class="label">X</p>
      <p id="angle-x" class="angle bw">0.0°</p>
    </div>
    <div class="col-6">
      <p class="label">Y</p>
      <p id="angle-y" class="angle bw">0.0°</p>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 mt-3">
      <button type="button" id="button-start" class="btn btn-success">Start</button>
    </div>
    <div class="col-6 mt-3">
      <button type="button" id="button-calibrate" class="btn btn-secondary">Calibrate</button>
    </div>
    <div class="col-6 mt-3">
      <button type="button" id="button-reset" class="btn btn-secondary">Reset</button>
    </div>
  </div>
</div>

<script src="/assets/bubble-level/bubble-level.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

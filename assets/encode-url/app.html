<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Url encode / decode</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Url encode / decode">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/encode-url/encode-url.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="encode-url container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h2>Url encode / decode</h2>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 col-md-6">
      <p>Text to url encode</p>
      <textarea id="decoded-text"></textarea>
    </div>
    <div class="col-sm-12 col-md-6">
      <p>Url encoded text</p>
      <textarea id="encoded-text"></textarea>
    </div>
    <div class="col-sm-12">
      <p>CSS for SVG</p>
      <textarea id="escaped-css">
        .myImage:before {
            background-image: url('data:image/svg+xml;charset=US-ASCII,');
            background-repeat: no-repeat;
        }
      </textarea>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button class="btn btn-secondary" type="button" id="encode-btn">Encode</button>
    </div>
    <div class="col-sm-12 col-md-6 mt-3">
      <button class="btn btn-secondary" type="button" id="decode-btn">Decode</button>
    </div>
  </div>
</div>

<script src="/assets/encode-url/encode-url.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

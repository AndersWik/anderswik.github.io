<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slot Machine</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Slot Machine">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/slot-machine/slot-machine.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Slot Machine</h1>
  <div class="slot-machine clearfix">
    <span id="machine-title">JACKPOT!</span>
    <div class="slot pad10">♠</div>
    <div class="slot pad10 red">♥</div>
    <div class="slot red">♦</div>
  </div>
  <p class="coins">Coins: <span id="coins">20</span></p>
  <div class="controls">
    <button type="button" id="start">Spin</button>
    <button type="button" id="stop">Stop</button>
    <button type="button" id="restart" hidden>New game</button>
  </div>
  <div class="slot-info">
    <p id="slot-message" aria-live="polite">Try your luck!</p>
  </div>
</div>
</div>

<script src="/assets/slot-machine/slot-machine.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

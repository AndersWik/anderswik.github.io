<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice roller</title>
  <style>
    body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 16px;
    }

    body {
        text-align: center;
    }

    #dice-preview {
        width: 250px;
        height: 250px;
        margin: 0 auto 10px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 80px;
    }

    /* The picture for each die. The script sets the class, e.g. "d6". */
    #dice-preview.d4 { background-image: url("images/d4.svg"); }
    #dice-preview.d6 { background-image: url("images/d6.svg"); }
    #dice-preview.d8 { background-image: url("images/d8.svg"); }
    #dice-preview.d10 { background-image: url("images/d10.svg"); }
    #dice-preview.d12 { background-image: url("images/d12.svg"); }
    #dice-preview.d20 { background-image: url("images/d20.svg"); }

    .spin {
        animation: spin 1s;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    select,
    button {
        padding: 10px;
        font-size: 18px;
    }

    p {
        font-size: 22px;
        font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Dice roller</h1>

  <div id="dice-preview" class="d4">
    <span id="preview-text">4</span>
  </div>

  <select id="dice-type" aria-label="Die">
    <option value="4" selected>D4 (4 sides)</option>
    <option value="6">D6 (6 sides)</option>
    <option value="8">D8 (8 sides)</option>
    <option value="10">D10 (10 sides)</option>
    <option value="12">D12 (12 sides)</option>
    <option value="20">D20 (20 sides)</option>
  </select>
  <button type="button" id="roll-dice-btn">Roll dice</button>

  <p id="dice-selected"></p>
  <p id="dice-result" aria-live="polite"></p>

  <script>
    /*
     * Dice roller: pick a die with 4, 6, 8, 10, 12 or 20 sides and roll it.
     *
     * The picture of the die is set in the CSS: the preview gets a class like
     * "d6", and the CSS has a background picture for each class.
     */

    // --- Elements on the page ------------------------------------------------

    const diceSelect = document.getElementById("dice-type");
    const preview = document.getElementById("dice-preview");
    const previewText = document.getElementById("preview-text");
    const rollButton = document.getElementById("roll-dice-btn");
    const selectedText = document.getElementById("dice-selected");
    const resultText = document.getElementById("dice-result");

    const SPIN_TIME = 1000; // ms, the same as the spin animation in the CSS

    // --- Helpers -------------------------------------------------------------

    // A whole number from 1 to sides, all equally likely.
    //   Math.random() * 6 is 0 to 5.999..., Math.floor makes it 0-5, + 1 gives 1-6.
    function roll(sides) {
        return Math.floor(Math.random() * sides) + 1;
    }

    // --- Actions -------------------------------------------------------------

    function chooseDie() {
        const sides = Number(diceSelect.value);
        preview.className = "d" + sides;
        previewText.textContent = sides;
        // The text of the chosen option, e.g. "D6 (6 sides)".
        selectedText.textContent = diceSelect.selectedOptions[0].text + " selected";
        resultText.textContent = "";
    }

    function rollDie() {
        if (preview.classList.contains("spin")) {
            return; // still rolling
        }
        const result = roll(Number(diceSelect.value));

        resultText.textContent = "";
        preview.classList.add("spin");
        setTimeout(function () {
            preview.classList.remove("spin");
            previewText.textContent = result;
            resultText.textContent = "You rolled " + result;
        }, SPIN_TIME);
    }

    // --- Connect the page ----------------------------------------------------

    diceSelect.addEventListener("change", chooseDie);
    rollButton.addEventListener("click", rollDie);

    // --- Start ---------------------------------------------------------------

    chooseDie();
    selectedText.textContent = "Select a die and click Roll!";
  </script>
</body>
</html>

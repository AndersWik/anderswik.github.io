<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Roller</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/choose-dice/choose-dice.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Dice Roller</h1>
  <div id="dice-preview" class="d4">
    <span id="preview-text">4</span>
  </div>
  <div class="dice-options">
    <select id="dice-type" aria-label="Die">
      <option value="4" selected>D4 (4 sides)</option>
      <option value="6">D6 (6 sides)</option>
      <option value="8">D8 (8 sides)</option>
      <option value="10">D10 (10 sides)</option>
      <option value="12">D12 (12 sides)</option>
      <option value="20">D20 (20 sides)</option>
    </select>
  </div>
  <button type="button" id="roll-dice-btn">Roll Dice</button>
  <div class="dice-selected" id="dice-selected"></div>
  <div class="dice-result" id="dice-result" aria-live="polite"></div>
</div>
</div>

<script src="/assets/choose-dice/choose-dice.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

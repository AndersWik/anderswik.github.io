<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Reader</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="QR Reader">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/qr-reader/qr-reader.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="qr-reader container-sm mt-3 mb-3 pt-5 pb-5 text-center">
  <div class="row align-items-start">
    <div class="col">
      <h1 class="h2">QR Reader</h1>
      <p id="message">Press Start and point the camera at a QR code.</p>
    </div>
  </div>
  <div class="row mt-2">
    <div class="col">
      <div id="viewfinder" class="viewfinder">
        <video id="video" playsinline muted></video>
        <div class="frame" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <div id="result" class="row mt-3" hidden>
    <div class="col">
      <div class="result">
        <p id="result-type" class="label">Text</p>
        <p id="result-text" class="result-text"></p>
        <p id="result-host" class="result-host" hidden></p>
        <div class="actions">
          <a id="open-link" class="btn btn-outline-dark" target="_blank" rel="noopener noreferrer" hidden>Open link</a>
          <button type="button" id="copy" class="btn btn-outline-dark">Copy</button>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 mt-3">
      <button type="button" id="button-start" class="btn btn-success">Start</button>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col">
      <label for="file" class="label">Or read a QR code from a picture</label>
      <input type="file" id="file" accept="image/*" class="form-control mt-1">
    </div>
  </div>
  <div id="history-box" class="row mt-4" hidden>
    <div class="col">
      <p class="label">Read before</p>
      <ul id="history" class="history"></ul>
      <button type="button" id="clear-history" class="btn btn-link btn-sm">Clear the list</button>
    </div>
  </div>
  <p id="engine" class="mt-4 text-muted small">&nbsp;</p>
</div>

<script src="/assets/qr-reader/jsQR.js"></script>
<script src="/assets/qr-reader/qr-reader.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

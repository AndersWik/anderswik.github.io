<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Tic Tac Toe">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/tic-tac-toe/tic-tac-toe.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Tic Tac Toe</h1>
  <div class="board" id="board">
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
    <button type="button" class="square"></button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <button type="button" id="reset">New game</button>
  <div class="controls">
    <label for="mode">Play against:</label>
    <select id="mode">
      <option value="pvp">A friend</option>
      <option value="easy">The computer (easy)</option>
      <option value="smart" selected>The computer (smart)</option>
    </select>
  </div>
</div>
</div>

<script src="/assets/tic-tac-toe/tic-tac-toe.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

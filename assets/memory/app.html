<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory</title>

  <!-- Makes this page an installable app, see _scripts/make-pwa.py. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <!-- iPhone and iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Memory">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/memory/memory.css">
  <style>
    /* Without the site header the games would touch the top of the screen. */
    .game { padding-block: 16px; }
  </style>
</head>
<body>
<div class="game">
<div class="container">
  <h1>Memory Game</h1>
  <div id="board"></div>
  <p id="status" aria-live="polite"></p>
  <div class="controls">
    <label for="size">Size:</label>
    <select id="size">
      <option value="4">XS (8 cards)</option>
      <option value="6">S (12 cards)</option>
      <option value="8" selected>M (16 cards)</option>
      <option value="10">L (20 cards)</option>
      <option value="12">XL (24 cards)</option>
    </select>
    <button type="button" id="restart">New game</button>
  </div>
</div>
</div>

<script src="/assets/memory/memory.js"></script>
<script>
  // The service worker saves the app so it also works offline.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>

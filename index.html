---
layout: default
---

<div class="home pt-5">
  <div class="terminal">
    <div class="menu">
      <h1 class="title">anderswik.se</h1>
      <span class="close-btn"></span>
      <span class="hide-btn"></span>
      <span class="full-btn"></span>
    </div>
    <div class="text">
        <span class="terminal-row login">Last login:</span>
        <span class="terminal-row">anders-wik: anderswik$ git pull</span>
        <span class="terminal-row">From https://github.com/AndersWik</span>
        <span class="terminal-row">Already up to date.</span>
        <span class="usr">anders-wik: anderswik$ <span class="b">&#x25AE;</span></span>
    </div>
  </div>
  <section class="certifications">
    <h2 class="certifications-title">Certifications</h2>
    <ul class="badges">
      <li class="badge-card">
        <img src="{{ site.baseurl }}/assets/images/frontend_developer.png" alt="Magento Certified Front End Developer">
        <span class="badge-name">Magento Front End Developer</span>
      </li>
      <li class="badge-card">
        <img src="{{ site.baseurl }}/assets/images/cert-mark-POPM.svg" alt="SAFe Product Owner / Product Manager">
        <span class="badge-name">SAFe Product Owner / Product Manager</span>
      </li>
      <li class="badge-card">
        <img src="{{ site.baseurl }}/assets/images/cert-mark-SSM.svg" alt="SAFe Scrum Master">
        <span class="badge-name">SAFe Scrum Master</span>
      </li>
    </ul>
  </section>
  <script>
    var dt = new Date().toLocaleString();
    var te = document.getElementsByClassName("login");
    te[0].innerHTML = te[0].innerHTML+" "+dt;
  </script>
</div>

---
layout: game
title: Chore Wheel
permalink: /games/chore-wheel/
nonav: true
css:
  - /assets/chore-wheel/chore-wheel.css
js:
  - /assets/chore-wheel/chore-wheel.js
---
<div class="container">
  <h1>Chore Wheel</h1>
  <form class="input-row" id="chore-form" autocomplete="off">
    <input type="text" id="choreInput" placeholder="Enter Chore" aria-label="Chore" />
    <button type="submit" id="choreButton">Add Chore</button>
  </form>
  <form class="input-row" id="person-form" autocomplete="off">
    <input type="text" id="personInput" placeholder="Enter Person" aria-label="Person" />
    <button type="submit" id="personButton">Add Person</button>
  </form>
  <div id="wheel-container">
    <canvas id="wheel" width="300" height="300"></canvas>
    <div id="names-container"></div>
  </div>
  <button type="button" id="spinButton">Spin Wheel</button>
  <p id="result" aria-live="polite"></p>
  <div class="list-container">
    <div>
      <h2>Chores</h2>
      <ul id="choreList"></ul>
    </div>
    <div>
      <h2>People</h2>
      <ul id="peopleList"></ul>
    </div>
  </div>
</div>
<p class="text-center mt-4"><a href="/tutorials/chore-wheel/">How to build this game</a></p>

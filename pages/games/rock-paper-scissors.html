<div class="container">
  <h1>Rock Paper Scissors</h1>
  <div class="score">
    <div id="player">
      <p>Player</p>
      <p id="playerScore">0</p>

        id="playerImage"
        src="{{ site.baseurl }}/assets/rock-paper-scissors/images/Rock.svg"
        alt=""
      />
      <div id="playerChoice">Rock</div>
    </div>
    <div id="cpu">
      <p>CPU</p>
      <p id="computerScore">0</p>
      <img
        id="computerImage"
        src="{{ site.baseurl }}/assets/rock-paper-scissors/images/Scissors.svg"
        alt=""
      />
      <div id="computerChoice">Scissors</div>
    </div>

  <p id="result"></p>
  <div class="choices">
    <button id="rockBtn">Rock</button>
    <button id="paperBtn">Paper</button>

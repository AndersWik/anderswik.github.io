---
layout: game
title: Sudoku
permalink: /games/sudoku/
nonav: true
css:
  - /assets/sudoku/sudoku.css
js:
  - /assets/sudoku/sudoku.js
---
<div class="container">
  <h1>Sudoku</h1>
  <label class="difficulty">
    Difficulty
    <select id="gameMode">
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
  </label>

  <div id="sudoku-board"></div>

  <div class="number-pad" id="numberPad">
    <button data-number="1">1</button>
    <button data-number="2">2</button>
    <button data-number="3">3</button>
    <button data-number="4">4</button>
    <button data-number="5">5</button>
    <button data-number="6">6</button>
    <button data-number="7">7</button>
    <button data-number="8">8</button>
    <button data-number="9">9</button>
    <button data-number="" aria-label="Erase">&times;</button>
  </div>

  <div class="actions">
    <button id="checkBoard">Check</button>
    <button id="getHint">Hint</button>
    <button id="restartGame">New game</button>
  </div>
  <p id="status" class="status"></p>

  <div id="overlay">
    <div id="info">
      <button id="overlayClose" aria-label="Close">&times;</button>
      <p id="overlayMessage"></p>
      <button id="overlayRestart">New game</button>
    </div>
  </div>
</div>

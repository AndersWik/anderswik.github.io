# Games and apps that are made into browser extensions for Firefox.
#
# After changing this list or any of the apps, run:
#   python3 _scripts/make-extension.py
# It writes a folder and a zip for every app into _extensions/.
# Test a folder in Firefox: about:debugging, This Firefox, Load Temporary
# Add-on, and pick its manifest.json. Upload the zip to addons.mozilla.org.
#
#   slug         folder in assets/, and the add-on id <slug>@anderswik.se
#                (never change it after the add-on is published)
#   page         the page the app is made from
#   name         full name (default: the page title)
#   emoji        icon picture
#   label        optional short text under the emoji, for apps with the same emoji
#   version      raise it for every new upload to addons.mozilla.org (default 1.0)
#   description  text on the add-on page (default: "<name> from anderswik.se.")
#   open         popup (default): a small window under the toolbar button
#                tab: a new tab, for big apps and keyboard games, since a popup
#                closes as soon as it loses focus
#   width        popup width in pixels (default 360, at most 800)
#
# Timers (countdown, egg-clock) open in a tab: a popup and its timer stop as
# soon as it loses focus.


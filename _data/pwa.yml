# Games and apps that can be installed as a Progressive Web App (PWA).
#
# Only apps that work on a phone are listed: no keyboard needed to play.
# Left out on purpose: the keyboard games (asteroids, breakout, pong,
# space-fighter, space-invader, volleyball, and arcade-shooter, artillery,
# hock-a-loogie, missile-command, pool, whack-a-mole that need Enter to start),
# and utils/vagrant (downloads a Vagrantfile, a desktop tool).
#
# After changing this list or any of the apps, run:
#   python3 _scripts/make-pwa.py
# It writes app.html, manifest.webmanifest, sw.js and icons into assets/<slug>/.
# _layouts/default.html uses this list to show "Install as an app" on the page.
#
#   slug        folder in assets/ (and the app's id)
#   page        the page the app is made from
#   name        full name (default: the page title)
#   short_name  name under the icon on a home screen, max about 12 characters
#   emoji       icon picture
#   label       optional short text under the emoji, for apps with the same emoji

